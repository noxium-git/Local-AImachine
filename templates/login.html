<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Betten AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        background: linear-gradient(135deg, #000000 0%, #330000 100%);
        min-height: 100vh;
      }
    </style>
  </head>
  <body class="flex items-center justify-center min-h-screen">
    <div
      class="bg-black bg-opacity-80 p-8 rounded-lg shadow-lg max-w-md w-full border border-red-600"
    >
      <div class="text-center mb-6">
        <img
          src="{{ url_for('static', filename='images/bettenLocal.jpg') }}"
          alt="Betten Logo"
          class="w-16 h-16 mx-auto mb-4 rounded-full border-2 border-red-500"
        />
        <h1 class="text-2xl font-bold text-red-400">Welcome to Betten AI</h1>
        <p class="text-gray-300">Please log in to continue</p>
      </div>
      <form method="post">
        <div class="mb-4">
          <label for="username" class="block text-red-400 font-bold"
            >Username</label
          >
          <input
            type="text"
            id="username"
            name="username"
            required
            class="w-full px-3 py-2 bg-gray-800 border border-red-600 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-red-500"
          />
        </div>
        <div class="mb-6">
          <label for="password" class="block text-red-400 font-bold"
            >Password</label
          >
          <input
            type="password"
            id="password"
            name="password"
            required
            class="w-full px-3 py-2 bg-gray-800 border border-red-600 rounded-md text-white focus:outline-none focus:ring-2 focus:ring-red-500"
          />
        </div>
        <button
          type="submit"
          class="w-full bg-red-600 text-white py-2 rounded-md hover:bg-red-700 transition duration-200"
        >
          Login
        </button>
      </form>
      {% with messages = get_flashed_messages() %} {% if messages %}
      <div class="mt-4 text-red-400 text-center">{{ messages[0] }}</div>
      {% endif %} {% endwith %}
    </div>
  </body>
</html>
