<!doctype html>
<html lang="en" {% if initial_theme and initial_theme != 'crimson' %}data-theme="{{ initial_theme }}"{% endif %}>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - Court</title>
    <style>
      {% set theme = initial_theme|default('crimson') %}
      :root {
        --brand-300: #fca5a5;
        --brand-400: #f87171;
        --brand-600: #dc2626;
        --brand-700: #b91c1c;
        --brand-soft: rgba(255, 0, 0, 0.22);
        --accent: rgba(230, 0, 0, 0.18);
        --page-gradient: linear-gradient(135deg, #090909 0%, #220000 100%);
      }
      {% if theme == 'purple' %}
      :root {
        --brand-300: #c4b5fd;
        --brand-400: #a78bfa;
        --brand-600: #7c3aed;
        --brand-700: #6d28d9;
        --brand-soft: rgba(109, 40, 217, 0.22);
        --accent: rgba(124, 58, 237, 0.2);
        --page-gradient: linear-gradient(135deg, #0b0319 0%, #220b47 100%);
      }
      {% elif theme == 'pink' %}
      :root {
        --brand-300: #f9a8d4;
        --brand-400: #f472b6;
        --brand-600: #db2777;
        --brand-700: #be185d;
        --brand-soft: rgba(190, 24, 93, 0.22);
        --accent: rgba(236, 72, 153, 0.2);
        --page-gradient: linear-gradient(135deg, #16040e 0%, #3e0a25 100%);
      }
      {% elif theme == 'black' %}
      :root {
        --brand-300: #9ca3af;
        --brand-400: #6b7280;
        --brand-600: #374151;
        --brand-700: #1f2937;
        --brand-soft: rgba(31, 41, 55, 0.24);
        --accent: rgba(75, 85, 99, 0.2);
        --page-gradient: linear-gradient(135deg, #050505 0%, #181818 100%);
      }
      {% elif theme == 'blue' %}
      :root {
        --brand-300: #93c5fd;
        --brand-400: #60a5fa;
        --brand-600: #2563eb;
        --brand-700: #1d4ed8;
        --brand-soft: rgba(29, 78, 216, 0.22);
        --accent: rgba(59, 130, 246, 0.2);
        --page-gradient: linear-gradient(135deg, #031022 0%, #0a2c63 100%);
      }
      {% elif theme == 'emerald' %}
      :root {
        --brand-300: #6ee7b7;
        --brand-400: #34d399;
        --brand-600: #059669;
        --brand-700: #047857;
        --brand-soft: rgba(4, 120, 87, 0.22);
        --accent: rgba(16, 185, 129, 0.2);
        --page-gradient: linear-gradient(135deg, #02120d 0%, #0a3f2f 100%);
      }
      {% elif theme == 'orange' %}
      :root {
        --brand-300: #fdba74;
        --brand-400: #fb923c;
        --brand-600: #ea580c;
        --brand-700: #c2410c;
        --brand-soft: rgba(194, 65, 12, 0.22);
        --accent: rgba(249, 115, 22, 0.2);
        --page-gradient: linear-gradient(135deg, #140902 0%, #4a220a 100%);
      }
      {% endif %}
      [data-theme='purple'] {
        --brand-300: #c4b5fd;
        --brand-400: #a78bfa;
        --brand-600: #7c3aed;
        --brand-700: #6d28d9;
        --brand-soft: rgba(109, 40, 217, 0.22);
        --accent: rgba(124, 58, 237, 0.2);
        --page-gradient: linear-gradient(135deg, #0b0319 0%, #220b47 100%);
      }
      [data-theme='pink'] {
        --brand-300: #f9a8d4;
        --brand-400: #f472b6;
        --brand-600: #db2777;
        --brand-700: #be185d;
        --brand-soft: rgba(190, 24, 93, 0.22);
        --accent: rgba(236, 72, 153, 0.2);
        --page-gradient: linear-gradient(135deg, #16040e 0%, #3e0a25 100%);
      }
      [data-theme='black'] {
        --brand-300: #9ca3af;
        --brand-400: #6b7280;
        --brand-600: #374151;
        --brand-700: #1f2937;
        --brand-soft: rgba(31, 41, 55, 0.24);
        --accent: rgba(75, 85, 99, 0.2);
        --page-gradient: linear-gradient(135deg, #050505 0%, #181818 100%);
      }
      [data-theme='blue'] {
        --brand-300: #93c5fd;
        --brand-400: #60a5fa;
        --brand-600: #2563eb;
        --brand-700: #1d4ed8;
        --brand-soft: rgba(29, 78, 216, 0.22);
        --accent: rgba(59, 130, 246, 0.2);
        --page-gradient: linear-gradient(135deg, #031022 0%, #0a2c63 100%);
      }
      [data-theme='emerald'] {
        --brand-300: #6ee7b7;
        --brand-400: #34d399;
        --brand-600: #059669;
        --brand-700: #047857;
        --brand-soft: rgba(4, 120, 87, 0.22);
        --accent: rgba(16, 185, 129, 0.2);
        --page-gradient: linear-gradient(135deg, #02120d 0%, #0a3f2f 100%);
      }
      [data-theme='orange'] {
        --brand-300: #fdba74;
        --brand-400: #fb923c;
        --brand-600: #ea580c;
        --brand-700: #c2410c;
        --brand-soft: rgba(194, 65, 12, 0.22);
        --accent: rgba(249, 115, 22, 0.2);
        --page-gradient: linear-gradient(135deg, #140902 0%, #4a220a 100%);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background:
          radial-gradient(
            circle at top left,
            var(--accent),
            transparent 28%
          ),
          var(--page-gradient);
        color: #f8f8f8;
      }

      body {
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .card {
        width: 100%;
        max-width: 500px;
        background: rgba(8, 8, 8, 0.98);
        border: 1px solid var(--brand-soft);
        border-radius: 1.25rem;
        box-shadow: 0 32px 120px rgba(0, 0, 0, 0.45);
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        color: var(--brand-300);
        text-align: center;
      }

      p.subtitle {
        margin: 0 0 1.5rem;
        color: #b9b9b9;
        text-align: center;
      }

      .form-group {
        margin-bottom: 1rem;
      }

      label {
        display: block;
        margin-bottom: 0.4rem;
        color: var(--brand-300);
      }

      input {
        width: 100%;
        padding: 0.9rem 1rem;
        border-radius: 0.9rem;
        border: 1px solid var(--brand-soft);
        background: rgba(30, 30, 30, 0.95);
        color: #fff;
      }

      input:focus {
        outline: none;
        border-color: var(--brand-400);
        box-shadow: 0 0 0 4px rgba(255, 59, 59, 0.14);
      }

      button {
        width: 100%;
        margin-top: 0.5rem;
        padding: 1rem;
        border: none;
        border-radius: 1rem;
        background: linear-gradient(135deg, var(--brand-600) 0%, var(--brand-700) 100%);
        color: #fff;
        font-weight: 700;
        cursor: pointer;
      }

      .feedback {
        margin-top: 1rem;
        text-align: center;
        color: #ff7474;
      }

      .links {
        margin-top: 1rem;
        text-align: center;
        color: #b9b9b9;
      }

      .links a {
        color: var(--brand-300);
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Create Local Account</h1>
      <p class="subtitle">Court stays local. Your account does too.</p>

      <form method="post">
        <div class="form-group">
          <label for="display_name">Display Name</label>
          <input
            type="text"
            id="display_name"
            name="display_name"
            required
            autocomplete="name"
          />
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            required
            minlength="3"
            autocomplete="username"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            minlength="8"
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label for="confirm_password">Confirm Password</label>
          <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            required
            minlength="8"
            autocomplete="new-password"
          />
        </div>

        <button type="submit">Create Account</button>
      </form>

      {% with messages = get_flashed_messages() %} {% if messages %}
      <div class="feedback">{{ messages[0] }}</div>
      {% endif %} {% endwith %}

      <div class="links">
        Already registered?
        <a href="{{ url_for('login') }}">Back to login</a>
      </div>
    </div>
    <script>
      (() => {
        const serverTheme = '{{ initial_theme|default("crimson") }}';
        const theme = serverTheme || localStorage.getItem('court_theme') || 'crimson';
        const palettes = {
          crimson: { brand300: '#fca5a5', brand400: '#f87171', brand600: '#dc2626', brand700: '#b91c1c', soft: 'rgba(255, 0, 0, 0.22)', accent: 'rgba(230, 0, 0, 0.18)', gradient: 'linear-gradient(135deg, #090909 0%, #220000 100%)' },
          purple: { brand300: '#c4b5fd', brand400: '#a78bfa', brand600: '#7c3aed', brand700: '#6d28d9', soft: 'rgba(109, 40, 217, 0.22)', accent: 'rgba(124, 58, 237, 0.2)', gradient: 'linear-gradient(135deg, #0b0319 0%, #220b47 100%)' },
          pink: { brand300: '#f9a8d4', brand400: '#f472b6', brand600: '#db2777', brand700: '#be185d', soft: 'rgba(190, 24, 93, 0.22)', accent: 'rgba(236, 72, 153, 0.2)', gradient: 'linear-gradient(135deg, #16040e 0%, #3e0a25 100%)' },
          black: { brand300: '#9ca3af', brand400: '#6b7280', brand600: '#374151', brand700: '#1f2937', soft: 'rgba(31, 41, 55, 0.24)', accent: 'rgba(75, 85, 99, 0.2)', gradient: 'linear-gradient(135deg, #050505 0%, #181818 100%)' },
          blue: { brand300: '#93c5fd', brand400: '#60a5fa', brand600: '#2563eb', brand700: '#1d4ed8', soft: 'rgba(29, 78, 216, 0.22)', accent: 'rgba(59, 130, 246, 0.2)', gradient: 'linear-gradient(135deg, #031022 0%, #0a2c63 100%)' },
          emerald: { brand300: '#6ee7b7', brand400: '#34d399', brand600: '#059669', brand700: '#047857', soft: 'rgba(4, 120, 87, 0.22)', accent: 'rgba(16, 185, 129, 0.2)', gradient: 'linear-gradient(135deg, #02120d 0%, #0a3f2f 100%)' },
          orange: { brand300: '#fdba74', brand400: '#fb923c', brand600: '#ea580c', brand700: '#c2410c', soft: 'rgba(194, 65, 12, 0.22)', accent: 'rgba(249, 115, 22, 0.2)', gradient: 'linear-gradient(135deg, #140902 0%, #4a220a 100%)' },
        };
        const palette = palettes[theme] || palettes.crimson;
        if (theme && theme !== 'crimson') {
          document.documentElement.setAttribute('data-theme', theme);
        }
        document.documentElement.style.setProperty('--brand-300', palette.brand300);
        document.documentElement.style.setProperty('--brand-400', palette.brand400);
        document.documentElement.style.setProperty('--brand-600', palette.brand600);
        document.documentElement.style.setProperty('--brand-700', palette.brand700);
        document.documentElement.style.setProperty('--brand-soft', palette.soft);
        document.documentElement.style.setProperty('--accent', palette.accent);
        document.documentElement.style.setProperty('--page-gradient', palette.gradient);
        localStorage.setItem('court_theme', theme);
      })();
    </script>
  </body>
</html>
